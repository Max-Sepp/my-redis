# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # Build and test in Debug (asserts live) under AddressSanitizer +
      # UndefinedBehaviorSanitizer, on Linux with both GCC and Clang:
      # 1. <Linux, Debug, GCC, ASan+UBSan>
      # 2. <Linux, Debug, Clang, ASan+UBSan>
      matrix:
        os: [ ubuntu-latest ]
        build_type: [ Debug ]
        c_compiler: [ gcc, clang ]
        include:
          - c_compiler: gcc
            cpp_compiler: g++
          - c_compiler: clang
            cpp_compiler: clang++

    steps:
      - uses: actions/checkout@v6

      - name: Set reusable strings
        # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
        id: strings
        shell: bash
        run: |
          echo "build-output-dir=${{ github.workspace }}/build/v2" >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
        # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
        # ASan + UBSan are enabled via CMAKE_CXX_FLAGS; -fno-sanitize-recover=all
        # turns every finding into a hard failure so the test job goes red.
        run: >
          cmake -B ${{ steps.strings.outputs.build-output-dir }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
          -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DBUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -S ${{ github.workspace }}/v2

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

      - name: Install LLVM lint tools
        # Use the newest clang-format/clang-tidy packaged in the runner's
        # Ubuntu archive. Lint runs once, on the clang leg, against the
        # compile_commands.json produced by the configure step above.
        if: matrix.c_compiler == 'clang'
        run: |
          sudo apt-get update
          LLVM_VERSION=$(apt-cache search --names-only '^clang-tidy-[0-9]+$' \
            | cut -d' ' -f1 | sed 's/^clang-tidy-//' | sort -n | tail -1)
          echo "Using LLVM $LLVM_VERSION"
          sudo apt-get install -y "clang-format-$LLVM_VERSION" "clang-tidy-$LLVM_VERSION"
          echo "CLANG_FORMAT=clang-format-$LLVM_VERSION" >> "$GITHUB_ENV"
          echo "CLANG_TIDY=clang-tidy-$LLVM_VERSION" >> "$GITHUB_ENV"
          echo "RUN_CLANG_TIDY=run-clang-tidy-$LLVM_VERSION" >> "$GITHUB_ENV"

      - name: clang-format
        if: matrix.c_compiler == 'clang'
        run: make format-check

      - name: clang-tidy
        if: matrix.c_compiler == 'clang'
        run: make tidy-check TIDY_BUILD_DIR=${{ steps.strings.outputs.build-output-dir }}

      - name: Unit tests
        working-directory: ${{ steps.strings.outputs.build-output-dir }}
        # Execute tests defined by the CMake configuration.
        # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
        # Tests are built via -DBUILD_TESTS=ON in the configure step; fail if none are found.
        # Abort on the first sanitizer finding so ctest reports a failure.
        env:
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --build-config ${{ matrix.build_type }} --no-tests=error

      - name: E2E handler tests
        # Spins up the real my_redis_server binary and exercises each
        # command handler over the wire (v2/tests/e2e/).
        env:
          SERVER_BIN: ${{ steps.strings.outputs.build-output-dir }}/my_redis_server
          ASAN_OPTIONS: halt_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: bash v2/tests/e2e/run_all.sh
